
# Shared settings. Values come from the root .env (create it with
# `node scripts/init-env.js`; setup.sh and start.sh do this for you).
x-dashboard-emitter-env: &dashboard-emitter-env
  DASHBOARD_EVENT_API_URL: http://h-dashboard-api:4010
  DASHBOARD_SERVICE_KEY: ${DASHBOARD_SERVICE_KEY:-}

x-hospital-api-env: &hospital-api-env
  <<: *dashboard-emitter-env
  NODE_ENV: ${NODE_ENV:-development}
  JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is not set. Run: node scripts/init-env.js}"
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
  FABRIC_BASE_PATH: /ehr-network
  FABRIC_CHANNEL: ${FABRIC_CHANNEL:-ehrchannel}
  FABRIC_CHAINCODE: ${FABRIC_CHAINCODE:-ehr}
  IPFS_SERVICE_URL: http://h-ipfs-service:4006
  IPFS_SERVICE_KEY: "${IPFS_SERVICE_KEY:?IPFS_SERVICE_KEY is not set. Run: node scripts/init-env.js}"
  # Symptom analysis agent (runs in peer0-api at registration / visit opening).
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}


services:


  # ──────────────────────────────────────────────────────────
  # NGINX — Single entry point (port 80)
  # ──────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/hub:/usr/share/nginx/html/hub:ro
    networks:
      - default
      - ehr_network
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────
  # FHIR module dependencies (one-shot)
  # The hospital APIs load /fhir/src, which needs ajv and canonicalize. They
  # are installed once into a named volume that the APIs mount read-only.
  # ──────────────────────────────────────────────────────────
  fhir-deps:
    image: node:20-slim
    working_dir: /fhir
    volumes:
      - ./fhir:/fhir
      - fhir-modules:/fhir/node_modules
    command: /bin/sh -c "npm install --omit=dev --no-audit --no-fund --no-package-lock"
    restart: "no"

  # ──────────────────────────────────────────────────────────
  # HOSPITAL BACKENDS
  # ──────────────────────────────────────────────────────────
  h-ipfs-service:
    image: ghcr.io/devbyhimans/ehr-h-ipfs-service:latest
    build:
      context: ./orgs/hospital/EHR_hospitalOrg-main/ehr-backend-v3/ipfs-service
    working_dir: /app
    volumes:
      - ./orgs/hospital/EHR_hospitalOrg-main/ehr-backend-v3/ipfs-service:/app
      - h-ipfs-service-modules:/app/node_modules
      - ./orgs/hospital/EHR_hospitalOrg-main/ehr-backend-v3/shared:/shared
    environment:
      <<: *dashboard-emitter-env
      PORT: 4006
      IPFS_API_URL: http://ipfs.ehr.local:5001
      IPFS_GATEWAY_URL: http://ipfs.ehr.local:8080
      IPFS_SERVICE_KEY: "${IPFS_SERVICE_KEY:?IPFS_SERVICE_KEY is not set. Run: node scripts/init-env.js}"
      IPFS_ENCRYPTION_KEY: "${IPFS_ENCRYPTION_KEY:?IPFS_ENCRYPTION_KEY is not set. Run: node scripts/init-env.js}"
    ports:
      - "4006:4006"
    networks:
      - default
      - ehr_network
    command: /bin/sh -c "if [ -f package-lock.json ]; then npm ci; else npm install --no-package-lock; fi && npm start"
    restart: unless-stopped

  h-peer0-api:
    image: ghcr.io/devbyhimans/ehr-h-peer0-api:latest
    build:
      context: ./orgs/hospital/EHR_hospitalOrg-main/ehr-backend-v3/peer0-api
    working_dir: /app
    volumes:
      - ./orgs/hospital/EHR_hospitalOrg-main/ehr-backend-v3/peer0-api:/app
      - h-peer0-api-modules:/app/node_modules
      - ./orgs/hospital/EHR_hospitalOrg-main/ehr-backend-v3/shared:/shared
      - ./orgs/hospital/EHR_hospitalOrg-main/ehr-network:/ehr-network:ro
      - ./fhir:/fhir:ro
      - fhir-modules:/fhir/node_modules:ro
    depends_on:
      fhir-deps:
        condition: service_completed_successfully
    environment:
      <<: *hospital-api-env
      PORT: 4001
      PEER_ADDRESS: peer0.hospital.example.com:7051
    ports:
      - "4001:4001"
    networks:
      - default
      - ehr_network
    command: /bin/sh -c "if [ -f package-lock.json ]; then npm ci; else npm install --no-package-lock; fi && npm start"
    restart: unless-stopped

  h-peer1-api:
    image: ghcr.io/devbyhimans/ehr-h-peer1-api:latest
    build:
      context: ./orgs/hospital/EHR_hospitalOrg-main/ehr-backend-v3/peer1-api
    working_dir: /app
    volumes:
      - ./orgs/hospital/EHR_hospitalOrg-main/ehr-backend-v3/peer1-api:/app
      - h-peer1-api-modules:/app/node_modules
      - ./orgs/hospital/EHR_hospitalOrg-main/ehr-backend-v3/shared:/shared
      - ./orgs/hospital/EHR_hospitalOrg-main/ehr-network:/ehr-network:ro
      - ./fhir:/fhir:ro
      - fhir-modules:/fhir/node_modules:ro
    depends_on:
      fhir-deps:
        condition: service_completed_successfully
    environment:
      <<: *hospital-api-env
      PORT: 4002
      PEER_ADDRESS: peer1.hospital.example.com:9051
    ports:
      - "4002:4002"
    networks:
      - default
      - ehr_network
    command: /bin/sh -c "if [ -f package-lock.json ]; then npm ci; else npm install --no-package-lock; fi && npm start"
    restart: unless-stopped

  h-peer2-api:
    image: ghcr.io/devbyhimans/ehr-h-peer2-api:latest
    build:
      context: ./orgs/hospital/EHR_hospitalOrg-main/ehr-backend-v3/peer2-api
    working_dir: /app
    volumes:
      - ./orgs/hospital/EHR_hospitalOrg-main/ehr-backend-v3/peer2-api:/app
      - h-peer2-api-modules:/app/node_modules
      - ./orgs/hospital/EHR_hospitalOrg-main/ehr-backend-v3/shared:/shared
      - ./orgs/hospital/EHR_hospitalOrg-main/ehr-network:/ehr-network:ro
      - ./fhir:/fhir:ro
      - fhir-modules:/fhir/node_modules:ro
    depends_on:
      fhir-deps:
        condition: service_completed_successfully
    environment:
      <<: *hospital-api-env
      PORT: 4003
      PEER_ADDRESS: peer2.hospital.example.com:10051
    ports:
      - "4003:4003"
    networks:
      - default
      - ehr_network
    command: /bin/sh -c "if [ -f package-lock.json ]; then npm ci; else npm install --no-package-lock; fi && npm start"
    restart: unless-stopped

  h-extorg-api:
    image: ghcr.io/devbyhimans/ehr-h-extorg-api:latest
    build:
      context: ./orgs/hospital/EHR_hospitalOrg-main/ehr-backend-v3/extorg-api
    working_dir: /app
    volumes:
      - ./orgs/hospital/EHR_hospitalOrg-main/ehr-backend-v3/extorg-api:/app
      - h-extorg-api-modules:/app/node_modules
      - ./orgs/hospital/EHR_hospitalOrg-main/ehr-backend-v3/shared:/shared
      - ./orgs/hospital/EHR_hospitalOrg-main/ehr-network:/ehr-network:ro
      - ./fhir:/fhir:ro
      - fhir-modules:/fhir/node_modules:ro
    depends_on:
      fhir-deps:
        condition: service_completed_successfully
    environment:
      <<: *hospital-api-env
      PORT: 4004
      DIAG_PEER_ADDRESS: peer0.diagnostic.example.com:8051
      PROV_PEER_ADDRESS: peer0.provider.example.com:11051
    ports:
      - "4004:4004"
    networks:
      - default
      - ehr_network
    command: /bin/sh -c "if [ -f package-lock.json ]; then npm ci; else npm install --no-package-lock; fi && npm start"
    restart: unless-stopped

  h-patient-api:
    image: ghcr.io/devbyhimans/ehr-h-patient-api:latest
    build:
      context: ./orgs/hospital/EHR_hospitalOrg-main/ehr-backend-v3/patient-api
    working_dir: /app
    volumes:
      - ./orgs/hospital/EHR_hospitalOrg-main/ehr-backend-v3/patient-api:/app
      - h-patient-api-modules:/app/node_modules
      - ./orgs/hospital/EHR_hospitalOrg-main/ehr-backend-v3/shared:/shared
      - ./orgs/hospital/EHR_hospitalOrg-main/ehr-network:/ehr-network:ro
      - ./fhir:/fhir:ro
      - fhir-modules:/fhir/node_modules:ro
    depends_on:
      fhir-deps:
        condition: service_completed_successfully
    environment:
      <<: *hospital-api-env
      PORT: 4005
      PEER_ADDRESS: peer0.hospital.example.com:7051
      SQLITE_PATH: ./data/patients.db
    ports:
      - "4005:4005"
    networks:
      - default
      - ehr_network
    command: /bin/sh -c "if [ -f package-lock.json ]; then npm ci; else npm install --no-package-lock; fi && npm start"
    restart: unless-stopped

  h-digilocker-service:
    image: ehr-h-digilocker-service:local
    build:
      context: ./orgs/digilocker/backend
    working_dir: /app
    volumes:
      - ./orgs/digilocker/backend:/app
      - h-digilocker-service-modules:/app/node_modules
      - h-digilocker-service-data:/data
      - ./orgs/hospital/EHR_hospitalOrg-main/ehr-network:/ehr-network:ro
    environment:
      <<: *dashboard-emitter-env
      PORT: 4007
      NODE_ENV: ${NODE_ENV:-development}
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is not set. Run: node scripts/init-env.js}"
      DIGILOCKER_VAULT_KEY: "${DIGILOCKER_VAULT_KEY:?DIGILOCKER_VAULT_KEY is not set. Run: node scripts/init-env.js}"
      DIGILOCKER_MODE: ${DIGILOCKER_MODE:-sandbox}
      DIGILOCKER_CLIENT_ID: ${DIGILOCKER_CLIENT_ID:-}
      DIGILOCKER_CLIENT_SECRET: ${DIGILOCKER_CLIENT_SECRET:-}
      DIGILOCKER_PUBLIC_URL: ${DIGILOCKER_PUBLIC_URL:-http://localhost:4007}
      DIGILOCKER_PORTAL_RETURN_URL: ${DIGILOCKER_PORTAL_RETURN_URL:-http://localhost:5174/digilocker}
      CORS_ALLOWED_ORIGINS: ${DIGILOCKER_CORS_ALLOWED_ORIGINS:-http://localhost:5174,http://localhost}
      DIGILOCKER_DATA_DIR: /data
      FABRIC_BASE_PATH: /ehr-network
      PEER_ADDRESS: peer0.hospital.example.com:7051
      FABRIC_CHANNEL: ${FABRIC_CHANNEL:-ehrchannel}
      FABRIC_CHAINCODE: ${FABRIC_CHAINCODE:-ehr}
      IPFS_SERVICE_URL: http://h-ipfs-service:4006
      IPFS_SERVICE_KEY: "${IPFS_SERVICE_KEY:?IPFS_SERVICE_KEY is not set. Run: node scripts/init-env.js}"
    ports:
      - "4007:4007"
    networks:
      - default
      - ehr_network
    command: /bin/sh -c "if [ -f package-lock.json ]; then npm ci; else npm install --no-package-lock; fi && npm start"
    restart: unless-stopped
  clinical-decision-support:
    image: ehr-clinical-decision-support:local
    build:
      context: ./services/clinical-decision-support
    working_dir: /app
    environment:
      HOST: 0.0.0.0
      PORT: 8001
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is not set. Run: node scripts/init-env.js}"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    expose:
      - "8001"
    networks:
      - default
      - ehr_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped

  clinical-ai-agent:
    image: ehr-clinical-ai-agent:local
    build:
      context: ./services/ai-agent
    working_dir: /app
    volumes:
      - ./services/ai-agent:/app
      - /app/.venv
    environment:
      <<: *dashboard-emitter-env
      HOST: 0.0.0.0
      PORT: 8000
      EHR_OFFLINE_MODE: "true"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is not set. Run: node scripts/init-env.js}"
    ports:
      - "8000:8000"
    networks:
      - default
      - ehr_network
    restart: unless-stopped

  h-dashboard-api:
    profiles: ["dashboard"]
    image: ehr-h-dashboard-api:local
    build:
      context: ./orgs/hospital/EHR_hospitalOrg-main/ehr-backend-v3/dashboard-api
    working_dir: /app
    env_file:
      - path: ./orgs/hospital/EHR_hospitalOrg-main/ehr-backend-v3/dashboard-api/.env
        required: false
    environment:
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is not set. Run: node scripts/init-env.js}"
      DASHBOARD_SERVICE_KEY: ${DASHBOARD_SERVICE_KEY:-}
      DASHBOARD_HEALTH_DIGILOCKER_URL: http://h-digilocker-service:4007/health
      DASHBOARD_FABRIC_GATEWAY_ENDPOINT: peer0.hospital.example.com:7051
      # Read-only observer identity, created by scripts/setup-dashboard-identity.sh.
      DASHBOARD_COLLECTOR_ENABLED: "true"
      DASHBOARD_FABRIC_PEER_ID: peer0.hospital
      DASHBOARD_FABRIC_PEER_HOST_ALIAS: peer0.hospital.example.com
      DASHBOARD_FABRIC_MSP_ID: HospitalMSP
      DASHBOARD_FABRIC_TLS_ROOT_CERT_PATH: orgs/hospital/EHR_hospitalOrg-main/ehr-backend-v3/dashboard-api/credentials/peer-tls-ca.pem
      DASHBOARD_FABRIC_IDENTITY_CERT_PATH: orgs/hospital/EHR_hospitalOrg-main/ehr-backend-v3/dashboard-api/credentials/observer-cert.pem
      DASHBOARD_FABRIC_IDENTITY_KEY_PATH: orgs/hospital/EHR_hospitalOrg-main/ehr-backend-v3/dashboard-api/credentials/observer-key.pem
      COLLECTOR_BACKFILL_BLOCKS: "100000"
      DASHBOARD_PEER_HOSPITAL_RECEPTION: peer0.hospital.example.com:7051
      DASHBOARD_PEER_HOSPITAL_DOCTOR: peer1.hospital.example.com:9051
      DASHBOARD_PEER_HOSPITAL_NURSE: peer2.hospital.example.com:10051
      DASHBOARD_PEER_DIAGNOSTICS: peer0.diagnostic.example.com:8051
      DASHBOARD_PEER_PROVIDER: peer0.provider.example.com:11051
      DASHBOARD_ORDERER: orderer.example.com:7050
      DASHBOARD_HEALTH_PEER0_API_URL: http://h-peer0-api:4001/health
      DASHBOARD_HEALTH_PEER1_API_URL: http://h-peer1-api:4002/health
      DASHBOARD_HEALTH_PEER2_API_URL: http://h-peer2-api:4003/health
      DASHBOARD_HEALTH_PATIENT_API_URL: http://h-patient-api:4005/health
      DASHBOARD_HEALTH_EXTORG_API_URL: http://h-extorg-api:4004/health
      DASHBOARD_HEALTH_IPFS_URL: http://h-ipfs-service:4006/health
      DASHBOARD_HEALTH_PHARMACY_URL: http://p-backend:3000/api/network-status
      DASHBOARD_HEALTH_CLINICAL_AI_URL: http://clinical-ai-agent:8000/health
      DASHBOARD_HEALTH_HISTORY_AGENT_URL: http://l-node-gateway:3000/api/health
      DASHBOARD_HEALTH_GOVERNANCE_AGENT_URL: http://l-node-gateway:3000/api/health
      DASHBOARD_HEALTH_PEER0_OPERATIONS_URL: http://peer0.hospital.example.com:17051/healthz
      DASHBOARD_HEALTH_PEER1_OPERATIONS_URL: http://peer1.hospital.example.com:19051/healthz
      DASHBOARD_HEALTH_PEER2_OPERATIONS_URL: http://peer2.hospital.example.com:20051/healthz
      DASHBOARD_HEALTH_DIAGNOSTICS_OPERATIONS_URL: http://peer0.diagnostic.example.com:18051/healthz
      DASHBOARD_HEALTH_PROVIDER_OPERATIONS_URL: http://peer0.provider.example.com:21051/healthz
      DASHBOARD_HEALTH_ORDERER_URL: http://orderer.example.com:17050/healthz
    ports:
      - "127.0.0.1:4010:4010"
    volumes:
      - ./orgs/hospital/EHR_hospitalOrg-main/ehr-backend-v3/dashboard-api/src:/app/src
      - ./orgs/hospital/EHR_hospitalOrg-main/ehr-backend-v3/dashboard-api/config:/app/config
      - h-dashboard-api-data:/app/orgs/hospital/EHR_hospitalOrg-main/ehr-backend-v3/dashboard-api/data
      - ./orgs/hospital/EHR_hospitalOrg-main/ehr-backend-v3/dashboard-api/credentials:/app/orgs/hospital/EHR_hospitalOrg-main/ehr-backend-v3/dashboard-api/credentials:ro
    networks:
      - default
      - ehr_network
    restart: unless-stopped

  h-dashboard-portal:
    profiles: ["dashboard"]
    image: node:20-slim
    working_dir: /app
    volumes:
      - ./orgs/hospital/EHR_hospitalOrg-main/ehr-frontend-v2/dashboard-portal:/app
      - h-dashboard-portal-modules:/app/node_modules
    environment:
      VITE_BASE_PATH: /dashboard/
      VITE_ACCEPT_HOSPITAL_TOKEN: "true"
    ports:
      - "127.0.0.1:5176:5176"
    command: /bin/sh -c "if [ -f package-lock.json ]; then npm ci; else npm install --no-package-lock; fi && npm run build && npm run preview -- --host 0.0.0.0 --port 5176 --strictPort"
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────
  # HOSPITAL FRONTENDS
  # ──────────────────────────────────────────────────────────
  h-hospital-portal:
    image: ghcr.io/devbyhimans/ehr-h-hospital-portal:latest
    build:
      context: ./orgs/hospital/EHR_hospitalOrg-main/ehr-frontend-v2/hospital-portal
    working_dir: /app
    volumes:
      - ./orgs/hospital/EHR_hospitalOrg-main/ehr-frontend-v2/hospital-portal:/app
      - h-hospital-portal-modules:/app/node_modules
    environment:
      VITE_PEER0_API_TARGET: http://h-peer0-api:4001
      VITE_PEER1_API_TARGET: http://h-peer1-api:4002
      VITE_PEER2_API_TARGET: http://h-peer2-api:4003
      VITE_EXTORG_API_TARGET: http://h-extorg-api:4004
      VITE_AI_AGENT_TARGET: http://clinical-ai-agent:8000
      VITE_IPFS_API_TARGET: http://h-ipfs-service:4006
    ports:
      - "5173:5173"
    command: /bin/sh -c "if [ -f package-lock.json ]; then npm ci; else npm install --no-package-lock; fi && npm run dev -- --host 0.0.0.0 --port 5173"
    restart: unless-stopped

  h-patient-portal:
    image: ghcr.io/devbyhimans/ehr-h-patient-portal:latest
    build:
      context: ./orgs/hospital/EHR_hospitalOrg-main/ehr-frontend-v2/patient-portal
    working_dir: /app
    volumes:
      - ./orgs/hospital/EHR_hospitalOrg-main/ehr-frontend-v2/patient-portal:/app
      - h-patient-portal-modules:/app/node_modules
    environment:
      VITE_PATIENT_API_URL: ${VITE_PATIENT_API_URL:-/api/patient}
      VITE_PATIENT_API_TARGET: http://h-patient-api:4005
      VITE_DIGILOCKER_API_URL: ${VITE_DIGILOCKER_API_URL:-http://localhost:4007}
    ports:
      - "5174:5174"
    command: /bin/sh -c "if [ -f package-lock.json ]; then npm ci; else npm install --no-package-lock; fi && npm run dev -- --host 0.0.0.0 --port 5174"
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────
  # PHARMACY ORG
  # ──────────────────────────────────────────────────────────
  p-backend:
    image: ghcr.io/devbyhimans/ehr-p-backend:latest
    build:
      context: ./orgs/pharmacy/fabric-network-swarm/app/backend
    working_dir: /app
    volumes:
      - ./orgs/pharmacy/fabric-network-swarm/app/backend:/app
      - p-backend-modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - IPFS_API=http://ipfs.ehr.local:5001/api/v0
      - "JWT_SECRET=${JWT_SECRET:?JWT_SECRET is not set. Run: node scripts/init-env.js}"
    networks:
      - default
      - ehr_network
    command: /bin/sh -c "if [ -f package-lock.json ]; then npm ci; else npm install --no-package-lock; fi && npm start"
    restart: unless-stopped

  p-frontend:
    image: ghcr.io/devbyhimans/ehr-p-frontend:latest
    build:
      context: ./orgs/pharmacy/fabric-network-swarm/app/frontend
    working_dir: /app
    volumes:
      - ./orgs/pharmacy/fabric-network-swarm/app/frontend:/app
      - p-frontend-modules:/app/node_modules
    ports:
      - "5175:5175"
    command: /bin/sh -c "if [ -f package-lock.json ]; then npm ci; else npm install --no-package-lock; fi && npm run dev -- --host 0.0.0.0 --port 5175"
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────
  # LAB ORG
  # ──────────────────────────────────────────────────────────
  l-node-gateway:
    image: ghcr.io/devbyhimans/ehr-l-node-gateway:latest
    depends_on:
      clinical-decision-support:
        condition: service_healthy
    build:
      context: ./orgs/lab/EHR-LABORG-main/client/node-gateway
    working_dir: /app
    volumes:
      - ./orgs/lab/EHR-LABORG-main/client/node-gateway:/app
      - ./orgs/hospital/EHR_hospitalOrg-main/ehr-network:/ehr-network:ro
      - ./orgs/lab/EHR-LABORG-main/connection-profiles:/connection-profiles:ro
      - ./orgs/lab/EHR-LABORG-main/organizations:/organizations:ro
      - l-node-gateway-modules:/app/node_modules
    environment:
      <<: *dashboard-emitter-env
      DASHBOARD_EVENT_ORG: DiagnosticsMSP
      PYTHON_CLINICAL_API_URL: http://clinical-decision-support:8001
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is not set. Run: node scripts/init-env.js}"
      EXTORG_API_URL: http://h-extorg-api:4004
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      IPFS_API_URL: http://ipfs.ehr.local:5001
      IPFS_GATEWAY_URL: http://ipfs.ehr.local:8080
      # Lab joins the shared ehrchannel as the Diagnostics organization.
      LAB_MSP_ID: DiagnosticsMSP
      LAB_PEER_ENDPOINT: peer0.diagnostic.example.com:8051
      LAB_PEER_TLS_CA: /ehr-network/organizations/peerOrganizations/diagnostic.example.com/peers/peer0.diagnostic.example.com/tls/ca.crt
      LAB_IDENTITY_MSP_DIR: /ehr-network/organizations/peerOrganizations/diagnostic.example.com/users/labtechnician/msp
      LAB_CHANNEL: ehrchannel
      LAB_CHAINCODE: labresults
      CONNECTION_PROFILE_PATH: /connection-profiles/lab-connection.json
      USER_MSP_DIR: /organizations/peerOrganizations/lab.example.com/users/User1@lab.example.com/msp
    ports:
      - "3006:3000"
    networks:
      - default
      - ehr_network
    command: /bin/sh -c "if [ -f package-lock.json ]; then npm ci; else npm install --no-package-lock; fi && npm run web"
    restart: unless-stopped

# ──────────────────────────────────────────────────────────
# Named volumes — node_modules live INSIDE Docker only
# These are NEVER shared with the host, preventing the
# Windows/Linux cross-platform npm binary crash
# ──────────────────────────────────────────────────────────
volumes:
