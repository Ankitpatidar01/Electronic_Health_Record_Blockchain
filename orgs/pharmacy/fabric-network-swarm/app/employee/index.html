<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Vitalis Employee Portal — Search patients, issue bills, and submit prescriptions to the Fabric blockchain." />
    <title>Vitalis — Employee Portal</title>
    <script>
      (function() {
        try {
          var cookie = document.cookie.match(/(?:^|; )ehr_appearance=(light|dark)/);
          var theme = (cookie && cookie[1]) || localStorage.getItem('ehr_appearance') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
          if (theme === 'dark') document.documentElement.classList.add('dark');
          else document.documentElement.classList.remove('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
