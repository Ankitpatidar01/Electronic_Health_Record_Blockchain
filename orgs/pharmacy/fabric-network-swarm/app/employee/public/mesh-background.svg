<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" fill="none">
  <defs>
    <radialGradient id="meshGrad1" cx="20%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#A8E6CF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#A8E6CF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="meshGrad2" cx="85%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#B7D3FF" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#B7D3FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="meshGrad3" cx="50%" cy="85%" r="65%">
      <stop offset="0%" stop-color="#FFE08A" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFE08A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="meshGrad4" cx="15%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#F8C8DC" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#F8C8DC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#1E4DFF"/>
    </linearGradient>
  </defs>

  <!-- Ambient Color Meshes -->
  <rect width="1440" height="900" fill="transparent"/>
  <circle cx="280" cy="180" r="420" fill="url(#meshGrad1)" filter="blur(70px)"/>
  <circle cx="1220" cy="220" r="460" fill="url(#meshGrad2)" filter="blur(80px)"/>
  <circle cx="720" cy="780" r="500" fill="url(#meshGrad3)" filter="blur(90px)"/>
  <circle cx="180" cy="740" r="380" fill="url(#meshGrad4)" filter="blur(80px)"/>

  <!-- Subtle Faint ECG Line -->
  <path d="M0 450 H400 L425 410 L450 490 L480 390 L510 470 L530 435 L550 450 H1440" stroke="#0E9AA7" stroke-width="1.2" stroke-opacity="0.12" fill="none"/>

  <!-- Stylized 3D Capsule Shapes (Reference 2 style) -->
  <g opacity="0.15" transform="translate(60, 140) rotate(-25)">
    <rect x="0" y="0" width="70" height="150" rx="35" fill="#FFFFFF" stroke="#1E4DFF" stroke-width="2"/>
    <path d="M0 75 H70 V115 C70 134.33 54.33 150 35 150 C15.67 150 0 134.33 0 115 Z" fill="#1E4DFF"/>
  </g>
  <g opacity="0.12" transform="translate(1320, 520) rotate(35)">
    <rect x="0" y="0" width="60" height="130" rx="30" fill="#FFFFFF" stroke="#0E9AA7" stroke-width="2"/>
    <path d="M0 65 H60 V100 C60 116.57 46.57 130 30 130 C13.43 130 0 116.57 0 100 Z" fill="#2DD4BF"/>
  </g>
</svg>
