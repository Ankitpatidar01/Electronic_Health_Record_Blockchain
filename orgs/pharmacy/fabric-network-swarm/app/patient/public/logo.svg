<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="vitalisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E4DFF"/>
      <stop offset="50%" stop-color="#0E9AA7"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>
  <!-- Rounded Base Shield -->
  <path d="M24 44C24 44 38 36 38 24V10L24 5L10 10V24C10 36 24 44 24 44Z" fill="url(#vitalisGrad)" fill-opacity="0.12" stroke="url(#vitalisGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Heart Shape -->
  <path d="M24 16C21.5 12 15 11 12.5 14.5C9.5 18.5 11 24 24 33C37 24 38.5 18.5 35.5 14.5C33 11 26.5 12 24 16Z" stroke="url(#vitalisGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- ECG Pulse line cutting across -->
  <path d="M7 23H15L17.5 18L21 28L25 15L28.5 25L30.5 21L33 23H41" stroke="#2DD4BF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>
  <!-- Center Chain-link Anchor Node -->
  <circle cx="24" cy="24" r="2.5" fill="#1E4DFF" stroke="#FFFFFF" stroke-width="1.5"/>
</svg>
